<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎮 PACMAN GAME - NEON EDITION</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>★ PACMAN GAME ★</h1>

    <div class="game-container">
      <div class="game-info">
        <div>🎯 Score: <span id="score">0</span></div>
        <div>❤️ Lives: <span id="lives">3</span></div>
      </div>

      <div id="game-board"></div>

      <div class="controls">
        <button id="start-btn">▶️ START GAME</button>
        <button id="reset-btn">🔄 RESET</button>
      </div>
    </div>

    <div id="game-over" class="game-over">
      <h2>💥 GAME OVER</h2>
      <p>Final Score: <span id="final-score">0</span></p>
      <button id="restart-btn">🎮 MAIN LAGI</button>
    </div>

    <div id="game-won" class="game-won">
      <h2>🏆 YOU WIN! 🏆</h2>
      <p>Final Score: <span id="win-score">0</span></p>
      <button id="play-again-btn">🎮 MAIN LAGI</button>
    </div>

    <!-- Elemen audio untuk suara game -->
    <audio id="eat-sound" src="eat.wav" preload="auto"></audio>
    <audio
      id="background-sound"
      src="background.wav"
      preload="auto"
      loop
    ></audio>
    <audio id="gameover-sound" src="over.wav" preload="auto"></audio>
    <audio id="victory-sound" src="victory.wav" preload="auto"></audio>

    <!-- Load semua file JavaScript dengan urutan yang benar -->
    <script src="config.js"></script>
    <script src="board.js"></script>
    <script src="movement.js"></script>
    <script src="logic.js"></script>
    <script src="main.js"></script>
  </body>
</html>
